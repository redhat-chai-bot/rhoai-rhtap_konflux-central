apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-ephemeral-branch
spec:
  description: "Forks an ephemeral branch from a known commit, via the GitHub refs API."
  params:
  - name: repo
    type: string
    description: org/repo to create the branch in, e.g. red-hat-data-services/RHOAI-Build-Config
  - name: source-sha
    type: string
    description: Commit to fork from, normally the release branch head the caller cloned
  - name: branch-name
    type: string
    description: Name of the ephemeral branch, e.g. eg-bundle-<pipeline-run-id>
  results:
  - name: branch-name
    description: Name of the created ephemeral branch
  - name: branch-sha
    description: Commit the ephemeral branch was forked at
  workspaces:
  - name: github-credentials
    description: Secret workspace holding a 'token' key with a GitHub API token
  steps:
  - name: create-branch
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    script: |
      #!/bin/bash
      set -euo pipefail

      # Retry wrapper for GitHub API calls. Retries on 5xx and transient
      # network errors; does NOT retry 4xx (auth/validation).
      # Usage: HTTP_CODE=$(retry_github_api <max> <delay> curl ...)
      retry_github_api() {
        local max_attempts=${1}; shift
        local delay=${1}; shift
        local attempt=1
        local http_code="" curl_exit=0
        while true; do
          http_code=$("$@") && curl_exit=0 || curl_exit=$?
          if [ "${curl_exit}" -ne 0 ]; then
            echo "curl failed (exit ${curl_exit}), attempt ${attempt}/${max_attempts}" >&2
          elif [ "${http_code}" -ge 500 ] 2>/dev/null && [ "${http_code}" -lt 600 ] 2>/dev/null; then
            echo "GitHub API returned HTTP ${http_code}, attempt ${attempt}/${max_attempts}" >&2
          else
            echo "${http_code}"
            return 0
          fi
          if [ "${attempt}" -ge "${max_attempts}" ]; then
            echo "GitHub API call failed after ${max_attempts} attempts" >&2
            echo "${http_code}"
            return 0
          fi
          echo "Retrying in ${delay}s..." >&2
          sleep "${delay}"
          attempt=$((attempt + 1))
        done
      }

      REPO="$(params.repo)"
      SOURCE_SHA="$(params.source-sha)"
      BRANCH="$(params.branch-name)"
      TOKEN=$(cat "$(workspaces.github-credentials.path)/token")

      if [ -z "${SOURCE_SHA}" ]; then
        echo "source-sha is empty - refusing to create ${BRANCH} without a known fork point." >&2
        exit 1
      fi

      # Guard against ever being pointed at a release branch: the name is the one thing a caller can get wrong
      case "${BRANCH}" in
        eg-*) ;;
        *)
          echo "Refusing to create '${BRANCH}': ephemeral branches must be named eg-*." >&2
          exit 1
          ;;
      esac

      echo "Forking ${BRANCH} from ${SOURCE_SHA} in ${REPO}"

      HTTP_CODE=$(retry_github_api 3 5 curl -sS -o /dev/null -w "%{http_code}" \
        -H "Authorization: token ${TOKEN}" \
        -X POST "https://api.github.com/repos/${REPO}/git/refs" \
        -d "{\"ref\":\"refs/heads/${BRANCH}\",\"sha\":\"${SOURCE_SHA}\"}")

      # 422 is "ref already exists"; a re-run should be idempotent, so reset to the fork point
      if [ "${HTTP_CODE}" = "422" ]; then
        echo "Branch ${BRANCH} already exists - resetting it to ${SOURCE_SHA}"
        PATCH_CODE=$(retry_github_api 3 5 curl -sS -o /dev/null -w "%{http_code}" \
          -H "Authorization: token ${TOKEN}" \
          -X PATCH "https://api.github.com/repos/${REPO}/git/refs/heads/${BRANCH}" \
          -d "{\"sha\":\"${SOURCE_SHA}\",\"force\":true}")
        if [ "${PATCH_CODE}" != "200" ]; then
          echo "Failed to reset ${BRANCH} (HTTP ${PATCH_CODE})" >&2
          exit 1
        fi
      elif [ "${HTTP_CODE}" != "201" ]; then
        echo "Failed to create ${BRANCH} (HTTP ${HTTP_CODE})" >&2
        exit 1
      fi

      echo -n "${BRANCH}"     > "$(results.branch-name.path)"
      echo -n "${SOURCE_SHA}" > "$(results.branch-sha.path)"
